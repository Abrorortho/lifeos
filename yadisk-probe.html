<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Проверка Яндекс Диска</title>
<style>
  :root { --bg:#f6f5f2; --fg:#1d1d1f; --mut:#6e6e73; --ok:#1f8a4c; --bad:#c62828; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111; --fg:#eee; --mut:#999; --card:#1c1c1e; } }
  body { margin:0; padding:16px max(16px, env(safe-area-inset-right)) 32px max(16px, env(safe-area-inset-left));
         background:var(--bg); color:var(--fg); font:16px -apple-system, system-ui, sans-serif; }
  h1 { font-size:20px; } input, button { font-size:16px; padding:10px 12px; border-radius:10px; border:1px solid #ccc; }
  input { width:100%; box-sizing:border-box; margin:4px 0 10px; }
  button { background:#2f6fed; color:#fff; border:0; margin:4px 4px 4px 0; }
  #log { background:var(--card); border-radius:12px; padding:12px; font:13px ui-monospace, Menlo, monospace; white-space:pre-wrap; word-break:break-all; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .mut { color:var(--mut); }
</style>
</head>
<body>
<h1>Проверка Яндекс Диска из браузера</h1>
<p class="mut">Режим: <b id="mode"></b>. Адрес страницы (Redirect URI): <b id="here"></b></p>

<label>ClientID приложения с oauth.yandex.ru</label>
<input id="cid" autocomplete="off" autocapitalize="off" spellcheck="false">
<button id="login">Войти через Яндекс</button>
<button id="logout">Забыть токен</button>
<p class="mut" id="tok"></p>

<button id="run">Запустить проверку</button>
<div id="log"></div>

<script>
const API = 'https://cloud-api.yandex.net/v1/disk';
const PATH = 'app:/lifeos/probe.json';
const $ = id => document.getElementById(id);
const log = (msg, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = msg; $('log').appendChild(d); };

$('mode').textContent = (navigator.standalone || matchMedia('(display-mode: standalone)').matches) ? 'на экране «Домой»' : 'Safari / браузер';
$('here').textContent = location.origin + location.pathname;
$('cid').value = localStorage.getItem('probe_cid') || '1d6b660814e04c48b1c6f70e06f7856b';

// Implicit flow: token comes back in #access_token=...
const h = new URLSearchParams(location.hash.slice(1));
if (h.get('access_token')) {
  localStorage.setItem('probe_token', h.get('access_token'));
  history.replaceState(null, '', location.pathname);
}
if (h.get('error')) log('Ошибка входа: ' + h.get('error') + ' ' + (h.get('error_description') || ''), 'bad');
const token = () => localStorage.getItem('probe_token');
$('tok').textContent = token() ? 'Токен получен.' : 'Токена нет.';

$('login').onclick = () => {
  const cid = $('cid').value.trim();
  if (!cid) return alert('Впишите ClientID');
  localStorage.setItem('probe_cid', cid);
  location.href = 'https://oauth.yandex.ru/authorize?response_type=token&client_id=' + encodeURIComponent(cid)
    + '&redirect_uri=' + encodeURIComponent(location.origin + location.pathname);
};
$('logout').onclick = () => { localStorage.removeItem('probe_token'); location.reload(); };

async function step(name, fn) {
  try { const r = await fn(); log('✓ ' + name + (r ? ' — ' + r : ''), 'ok'); return true; }
  catch (e) {
    const cors = e instanceof TypeError;
    log('✗ ' + name + ' — ' + (cors ? 'запрос заблокирован браузером (CORS или сеть): ' : '') + e.message, 'bad');
    return false;
  }
}
const auth = () => ({ Authorization: 'OAuth ' + token() });
async function api(method, url) {
  const r = await fetch(API + url, { method, headers: auth() });
  const body = r.status === 204 ? null : await r.json().catch(() => null);
  if (!r.ok && !(method === 'PUT' && r.status === 409)) throw new Error('HTTP ' + r.status + ' ' + JSON.stringify(body));
  return { status: r.status, body };
}

$('run').onclick = async () => {
  $('log').textContent = '';
  if (!token()) return log('Сначала войдите.', 'bad');
  log('UA: ' + navigator.userAgent, 'mut');
  const payload = JSON.stringify({ probe: true, at: new Date().toISOString(), text: 'Проверка кириллицы ✓🦷' });
  let up, down, meta1;

  // GET /disk needs cloud_api:disk.info; with app_folder only we check the app folder itself.
  await step('1. Токен работает (GET app:/)', async () => {
    const r = await fetch(API + '/resources?path=' + encodeURIComponent('app:/'), { headers: auth() });
    if (r.status === 401) throw new Error('401 — токен недействителен');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return 'HTTP ' + r.status;
  });
  await step('2. Создать папку app:/lifeos', async () => (await api('PUT', '/resources?path=' + encodeURIComponent('app:/lifeos'))).status === 409 ? 'уже есть' : 'создана');
  await step('3. Получить адрес загрузки', async () => {
    up = (await api('GET', '/resources/upload?overwrite=true&path=' + encodeURIComponent(PATH))).body;
    return new URL(up.href).host + ' (' + up.method + ')';
  });
  if (up) await step('4. PUT файла на адрес загрузки (главная проверка CORS)', async () => {
    const r = await fetch(up.href, { method: up.method || 'PUT', body: new Blob([payload], { type: 'application/json' }) });
    if (!(r.status === 201 || r.status === 202 || r.ok)) throw new Error('HTTP ' + r.status);
    return 'HTTP ' + r.status;
  });
  await step('5. Метаданные файла (md5, modified)', async () => {
    meta1 = (await api('GET', '/resources?fields=md5,modified,size&path=' + encodeURIComponent(PATH))).body;
    return 'md5 ' + meta1.md5 + ', modified ' + meta1.modified + ', ' + meta1.size + ' байт';
  });
  await step('6. Получить адрес скачивания', async () => {
    down = (await api('GET', '/resources/download?path=' + encodeURIComponent(PATH))).body;
    return new URL(down.href).host;
  });
  if (down) await step('7. GET файла по адресу скачивания (вторая проверка CORS, с редиректами)', async () => {
    // downloader.disk.yandex.ru answers 403 without CORS headers when a Referer is sent
    const r = await fetch(down.href, { referrerPolicy: 'no-referrer' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const t = await r.text();
    if (t !== payload) throw new Error('содержимое не совпало: ' + t.slice(0, 80));
    return 'HTTP ' + r.status + ', итоговый хост ' + new URL(r.url).host + ', содержимое совпало';
  });
  await step('8. Список папки app:/lifeos', async () => {
    const b = (await api('GET', '/resources?limit=50&path=' + encodeURIComponent('app:/lifeos'))).body;
    return b._embedded.items.map(i => i.name).join(', ');
  });
  await step('9. Удалить тестовый файл', async () => (await api('DELETE', '/resources?permanently=true&path=' + encodeURIComponent(PATH))).status);
  await step('10. Проверить ответ 401 читается (истёкший токен)', async () => {
    const r = await fetch(API + '/', { headers: { Authorization: 'OAuth invalid' } });
    if (r.status !== 401) throw new Error('ожидали 401, получили ' + r.status);
    return 'HTTP 401 виден странице';
  });
  log('Готово. Сделайте скриншот этого лога.', 'mut');
};
</script>
</body>
</html>
