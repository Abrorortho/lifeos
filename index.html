<style>
/* Layout: one phone-first column, sticky header, fixed bottom tab bar; colour taken from articulating paper — blue for progress, red for spending */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --sunk:#E6ECF3; --line:#D5DDE8; --fg:#0F1B2D; --muted:#5A6A80;
  --accent:#2C4ED4; --accent-ink:#FFFFFF; --accent-soft:#E2E8FF;
  --red:#CF3349; --red-soft:#FBE3E7; --good:#1C8455; --good-soft:#DCF2E6; --warn:#A86E12; --warn-soft:#FAEFD8;
  --scrim:rgba(12,18,30,.45);
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1019; --surface:#131A26; --sunk:#1A2332; --line:#263145; --fg:#E6EBF4; --muted:#8B99AF;
  --accent:#7090FF; --accent-ink:#0B1019; --accent-soft:#1B2752;
  --red:#FF6B80; --red-soft:#3A1820; --good:#4CC38A; --good-soft:#10301F; --warn:#E5B04A; --warn-soft:#33270F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1019; --surface:#131A26; --sunk:#1A2332; --line:#263145; --fg:#E6EBF4; --muted:#8B99AF;
  --accent:#7090FF; --accent-ink:#0B1019; --accent-soft:#1B2752;
  --red:#FF6B80; --red-soft:#3A1820; --good:#4CC38A; --good-soft:#10301F; --warn:#E5B04A; --warn-soft:#33270F;
  --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.top h1{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em;margin:0;flex:1;min-width:0}
.top .who{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.icon-btn svg{width:18px;height:18px}
main{display:grid;gap:24px}
.banner{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line)}
.sec{display:grid;gap:10px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-h h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.meta{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--red)}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center}
.hero .lvl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .title{font-family:var(--font-display);font-weight:700;font-size:24px;line-height:1.15;text-wrap:balance}
.hero .sub{font-size:13px;opacity:.9}
.hero .arch{grid-row:1/4;grid-column:2;width:132px;max-width:100%}
.hero .stats{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hero .pill{background:color-mix(in srgb,var(--accent-ink) 16%,transparent);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500}

/* chips & buttons */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14px}
.chip.in::before,.chip.out::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.out::before{background:var(--red)}
.chip.ghost{background:transparent;border-style:dashed}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:100%;padding:13px}
.btn.wide{width:100%}
.danger{color:var(--red)}

/* lists */
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:none;border:0;text-align:left;width:100%;min-width:0}
.row .grow,.item .grow{flex:1;min-width:0}
.row .t,.item .t{font-weight:500;overflow-wrap:anywhere}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.check.on .box{background:var(--good);border-color:var(--good)}
.check.on .box::after{content:"";width:10px;height:6px;border:2px solid var(--surface);border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
.check.on .t,.check.on .grow{color:var(--muted)}
.xp{font-family:var(--font-mono);font-size:12px;color:var(--accent);font-weight:600;white-space:nowrap}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;min-width:0}
.time{font-family:var(--font-mono);font-size:13px;color:var(--muted);width:46px;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.tag.money{background:var(--good-soft);color:var(--good)} .tag.practice{background:var(--accent-soft);color:var(--accent)}
.tag.brand{background:var(--warn-soft);color:var(--warn)} .tag.body{background:var(--red-soft);color:var(--red)}
.tag.debt{background:var(--red-soft);color:var(--red)}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}
.x-btn{border:0;background:none;color:var(--muted);font-size:18px;line-height:1;padding:6px 8px;border-radius:8px;flex:none}
.x-btn.armed{color:var(--red);font-size:12px;font-weight:600;background:var(--red-soft)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--font-display);font-weight:500;font-size:19px;font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.tile .s{font-size:12px;color:var(--muted);margin-top:2px}
button.tile,button.card,button.hb{font:inherit;color:inherit;text-align:left;width:100%;cursor:pointer}
button.hero{font:inherit;text-align:left;width:100%;cursor:pointer;border:0}
button.tile:hover,button.card:hover{border-color:var(--accent)}
button.tile .k{display:flex;justify-content:space-between;gap:6px}
button.tile .k::after,.tap-hint::after{content:"›";color:var(--accent);font-weight:700;font-size:16px;line-height:1}
button.hb{background:none;border:0;padding:4px 0;border-radius:8px}
button.hb .l span:last-child::after{content:" ›";color:var(--accent);font-weight:700}
.linkbtn{font:inherit;color:var(--accent);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.formula{background:var(--sunk);border-radius:12px;padding:12px 14px;display:grid;gap:7px;font-size:14px}
.frow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.frow>:first-child{min-width:0;overflow-wrap:anywhere}
.frow .num{white-space:nowrap}
.frow.total{border-top:1px solid var(--line);padding-top:8px;font-weight:600}
.frow.total .num{font-family:var(--font-display);font-weight:500;font-size:20px}
.amt{text-align:right;flex:none}
.lvl-row.on{background:var(--accent-soft)}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.red>i{background:var(--red)} .bar.good>i{background:var(--good)}
.hbars{display:grid;gap:10px}
.hb{display:grid;gap:4px}
.hb .l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hb .l span:first-child{min-width:0;overflow-wrap:anywhere}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:12px;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line)}
tr+tr td{border-top:1px solid var(--line)}
.month-sw{display:flex;align-items:center;gap:8px}
.month-sw b{min-width:120px;text-align:center;font-weight:600;text-transform:capitalize}
.dayhead{padding:8px 14px;font-size:12px;color:var(--muted);background:var(--sunk);font-weight:600}
.phase{display:grid;gap:8px}
.phase-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.phase-h b{font-family:var(--font-display);font-weight:500;font-size:15px}
.big{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.spark{width:100%;height:auto;display:block}
.note{font-size:13px;color:var(--muted);line-height:1.5}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.badge{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--surface);min-width:0}
.badge b{display:block;font-size:13px}
.badge span{font-size:12px;color:var(--muted)}
.badge.off{opacity:.45;border-style:dashed}
.badge.on{border-color:var(--accent);background:var(--accent-soft)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.tabs button{border:0;background:none;display:grid;justify-items:center;gap:3px;padding:9px 1px 8px;font-size:10.5px;color:var(--muted);font-weight:500;min-width:0;overflow:hidden;white-space:nowrap}
.pt th,.pt td{padding:10px 6px}
.pt th:first-child,.pt td:first-child{padding-left:14px}
.pt th:last-child,.pt td:last-child{padding-right:14px}
.pt tbody tr{cursor:pointer}
.pt tbody tr:hover td{background:var(--sunk)}
.pt .pn{font:inherit;font-weight:600;color:var(--fg);background:none;border:0;padding:0;text-align:left;cursor:pointer;overflow-wrap:anywhere}
.pt .pc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal;margin-top:2px}
.pt tfoot td{border-top:1px solid var(--line);font-weight:600}
.pt .ok{color:var(--good);font-weight:600}
#pat-q{font-size:16px}
.pt th:first-child,.pt td:first-child{position:sticky;left:0;z-index:1;background:var(--surface);min-width:150px;max-width:180px;box-shadow:1px 0 0 var(--line)}
.pt tbody tr:hover td:first-child{background:var(--sunk)}
.pt .mine{color:var(--accent);font-weight:600}
.split{font-family:var(--font-mono);font-size:13px;color:var(--accent);line-height:1.5}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--accent)}

/* sheet */
.wrap{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:90%;overflow:auto;border-radius:20px 20px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet form{display:grid;gap:12px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-h h3{margin:0;font-family:var(--font-display);font-weight:500;font-size:18px}
label.f{display:grid;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);width:100%;min-width:0}
textarea{min-height:110px;font-size:14px;line-height:1.5}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{flex:1;min-width:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;text-align:center;padding:9px 6px;border:1px solid var(--line);border-radius:10px;font-weight:600;font-size:14px;color:var(--fg)}
.seg input:checked+span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cb{display:flex;gap:10px;align-items:center;font-size:14px;color:var(--fg)}
.cb input{width:20px;height:20px;flex:none}
.preview{font-family:var(--font-mono);font-size:13px;color:var(--accent);min-height:18px}
.ex{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.ex .reps{display:flex;gap:6px;flex-wrap:wrap}
.ex .reps input{width:56px;text-align:center;padding:8px 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
/* web-app additions: calendar link styled as a button, sheets scroll without dragging the page behind them */
a.btn{text-decoration:none;color:inherit} a.btn.primary{color:var(--accent-ink)}
.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.more{display:grid;gap:12px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.more h2{margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
</style>

<div class="app">
  <header class="top">
    <div style="flex:1;min-width:0"><div class="who">Аброр · Life OS</div><h1 id="ttl">Сегодня</h1></div>
    <button class="icon-btn" data-act="settings" aria-label="Настройки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
  </header>
  <main id="main"><div class="empty">Загружаю…</div></main>
</div>
<nav class="tabs" aria-label="Разделы"><div class="in" id="tabs"></div></nav>
<div class="wrap" id="wrap" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

 A:{name:'День A · прямой хват и брусья',ex:[

const DEF={rate:12050,incomeGoal:30000000,start:'2026-10-19',
 channels:['Пациенты (своя практика)','Работы для врачей','Другие клиники','Лаборатория клиники','Лекции и курсы','Прочее'],
 services:['Брекеты','Элайнеры (сетап)','Сплинт','Хирургический шаблон','Аксиография','Аппарат','Консультация','Прочее'],

/* ---------- IndexedDB with the Firestore-style API the code above was written against ----------
   one database "lifeos", one object store per collection (key = document id) plus "meta" for app state.
   The whole database is mirrored in memory, so onSnapshot fires at once and after every write.
   Every document carries _updatedAt (ms); a deleted one stays as {_deleted:true,_updatedAt} so the
   deletion can travel to other devices through Yandex Disk. Screens never see either field. */
const STORES=['settings',...COLS,'days'];
const pub=d=>{const c={...d};delete c._updatedAt;delete c._deleted;return c};
let lastStamp=0;const stampNow=()=>(lastStamp=Math.max(Date.now(),lastStamp+1));
const stamp=d=>({...pub(d),_updatedAt:stampNow()});
function newId(){const a='abcdefghijklmnopqrstuvwxyz0123456789',r=crypto.getRandomValues(new Uint8Array(20));let s='';for(const x of r)s+=a[x%36];return s}
const idbDone=t=>new Promise((res,rej)=>{t.oncomplete=()=>res();t.onabort=t.onerror=()=>{const e=t.error;rej(e&&e.name==='QuotaExceededError'?{code:'quota_exceeded'}:e||new Error('idb'))}});
const idbReq=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const M={}; /* meta: lastBackup, localBackup, ya, yaSync, … */
const LDB={idb:null,docs:{},subs:{},
 open(){return new Promise((res,rej)=>{let r;try{r=indexedDB.open(DB_NAME,1)}catch(e){rej(e);return}
  r.onupgradeneeded=()=>{const d=r.result;for(const s of [...STORES,'meta'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s)};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))})
  .then(async d=>{this.idb=d;const t=d.transaction([...STORES,'meta']);
   const all=[...STORES,'meta'].map(c=>{const st=t.objectStore(c);return Promise.all([c,idbReq(st.getAllKeys()),idbReq(st.getAll())])});
   for(const [c,k,v] of await Promise.all(all)){
    if(c==='meta')k.forEach((x,i)=>M[x]=v[i]);else{const m=new Map();k.forEach((x,i)=>m.set(x,v[i]));this.docs[c]=m}}})},
 snap(c){const docs=[...this.docs[c]].filter(([,d])=>!d._deleted).sort((a,b)=>a[0]<b[0]?-1:a[0]>b[0]?1:0).map(([id,d])=>({id,data:()=>pub(d)}));return {docs,size:docs.length,empty:!docs.length}},
 docSnap(c,id){const d=this.docs[c].get(id),ok=!!d&&!d._deleted;return {id,exists:ok,data:()=>ok?pub(d):undefined}},
 emit(c){for(const f of this.subs[c]||[])try{f()}catch(e){console.warn(e)}},
 sub(c,f){(this.subs[c]=this.subs[c]||[]).push(f);f();return()=>{this.subs[c]=this.subs[c].filter(x=>x!==f)}},
 /* write [[id,doc]] to one or more stores; local=true means a change made on this phone (starts the sync timer) */
 put(byCol,local){const cols=Object.keys(byCol).filter(c=>byCol[c].length);if(!cols.length)return Promise.resolve();
  for(const c of cols)for(const [id,d] of byCol[c])this.docs[c].set(id,d);
  const t=this.idb.transaction(cols,'readwrite');for(const c of cols){const st=t.objectStore(c);for(const [id,d] of byCol[c])st.put(d,id)}
  for(const c of cols)this.emit(c);if(local)onLocalChange();return idbDone(t)},
 collection(c){const self=this;return {
  onSnapshot(cb){return self.sub(c,()=>cb(self.snap(c)))},
  add(data){const id=newId();return self.put({[c]:[[id,stamp(data)]]},true).then(()=>({id}))},
  doc(id){return self.doc(c+'/'+id)}}},
 doc(path){const self=this,[c,id]=path.split('/');return {id,
  onSnapshot(cb){return self.sub(c,()=>cb(self.docSnap(c,id)))},
  set:data=>self.put({[c]:[[id,stamp(data)]]},true),
  update:patch=>{const o=self.docs[c].get(id);return self.put({[c]:[[id,stamp({...(o&&!o._deleted?pub(o):{}),...patch})]]},true)},
  delete:()=>self.docs[c].has(id)?self.put({[c]:[[id,{_deleted:true,_updatedAt:stampNow()}]]},true):Promise.resolve()}}};
function metaSet(k,v){if(v===undefined)delete M[k];else M[k]=v;if(!LDB.idb)return Promise.resolve();
 const t=LDB.idb.transaction('meta','readwrite');v===undefined?t.objectStore('meta').delete(k):t.objectStore('meta').put(v,k);return idbDone(t).catch(e=>console.warn(e))}
/* ?db=<name> keeps a second, independent copy in the same browser (used to test sync between "two phones") */
const DB_NAME=(()=>{const n=new URLSearchParams(location.search).get('db');return n&&/^[a-z0-9-]{1,20}$/.test(n)?'lifeos-'+n:'lifeos'})();
let dbErr=null;
(async()=>{
 try{await LDB.open();db=LDB}catch(e){console.warn(e);db=null;dbErr=e}
 if(!db){S.loaded=true;render();return}
 S.live=true;let pending=COLS.length+2;const done=()=>{if(--pending===0){S.loaded=true}schedule()};
 const once=fn=>{let f=false;return()=>{if(!f){f=true;fn()}}};
 for(const c of COLS){const d=once(done);db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>({...x.data(),id:x.id}));d();schedule()},e=>{console.warn(c,e);d()})}
 const dd=once(done);db.collection('days').onSnapshot(s=>{const o={};for(const x of s.docs)o[x.id]=x.data();S.days=o;dd();schedule()},e=>{console.warn(e);dd()});
 const ds=once(done);db.doc('settings/main').onSnapshot(s=>{S.settings=s.exists?s.data():null;ds();schedule()},e=>{console.warn(e);ds()});
 afterOpen();
})();

  +S.goals.filter(g=>g.done).reduce((a,g)=>a+(+g.xp||40),0)+S.workouts.length*30

 let streak=0,d=today();if(habitCount(d)<3)d=addDays(d,-1);while(habitCount(d)>=3){streak++;d=addDays(d,-1)}
 let best=0,run=0,prev=null;for(const k of Object.keys(S.days).sort()){if(habitCount(k)>=3){run=prev&&daysBetween(prev,k)===1?run+1:1;prev=k;best=Math.max(best,run)}else{run=0;prev=null}}

function monthSum(mo){const c=cfg(),r={inc:0,unpaid:0,out:0,biz:0,pers:0,byCh:{},bySvc:{},byCat:{}};

  if(x.type==='in'){r.inc+=v;if(x.paid===false)r.unpaid+=toU(rest(x),x.cur,c);const ch=x.channel||'Прочее';r.byCh[ch]=(r.byCh[ch]||0)+v;
   const o=r.bySvc[x.service||'Прочее']||(r.bySvc[x.service||'Прочее']={v:0,n:0});o.v+=v;o.n++}
  else{r.out+=v;const k=x.cat||'Прочее';r.byCat[k]=(r.byCat[k]||0)+v;(c.bizCats||[]).includes(k)?r.biz+=v:r.pers+=v}}
 r.net=r.inc-r.out;return r}
function debts(){const a=[];for(const x of S.tx)if(x.type==='in'&&x.paid===false&&rest(x)>0)a.push({kind:'tx',id:x.id,who:x.party||'Без имени',what:x.service||x.channel||'',amount:rest(x),total:+x.amount||0,got:recv(x),cur:x.cur,since:x.date});
 for(const o of S.orders)if(o.status==='done')a.push({kind:'order',id:o.id,who:o.client,what:o.service,amount:+o.price||0,total:+o.price||0,got:0,cur:o.cur,since:o.at_done||o.date});
 return a.sort((p,q)=>(p.since||'').localeCompare(q.since||''))}
function curPhase(){for(const p of PHASES)if(S.goals.some(g=>(+g.phase||1)===p.n&&!g.done))return p.n;return 4}

function archSVG(p){const n=14,on=Math.round(p*n);let g='';
 for(let i=0;i<n;i++){const a=Math.PI*(1-i/(n-1)),x=66+52*Math.cos(a),y=78-58*Math.sin(a);
  const k=Math.min(i,n-1-i),w=k<2?13:k<4?11:k<5?9:8,h=k<2?14:k<4?12:11;
  const rot=-(a*180/Math.PI-90);
  g+=`<rect x="${(x-w/2).toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w}" height="${h}" rx="${k<4?4:3.5}" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="currentColor" fill-opacity="${i<on?1:.22}"/>`}
 return `<svg class="arch" viewBox="0 0 132 96" role="img" aria-label="Прогресс уровня: ${on} из ${n} зубов дуги">${g}</svg>`}
function hero(st){return `<button type="button" class="hero" data-act="drill" data-k="xp">

 ${archSVG(st.prog)}
 <div class="stats"><span class="pill num">Серия: ${st.streak} дн.</span><span class="pill num">Рекорд: ${st.best}</span><span class="pill num">Достижений: ${achievements(st).filter(a=>a[2]).length}/${achievements(st).length}</span><span class="pill">Как считаются очки ›</span></div></button>`}

 <section class="sec"><div class="sec-h"><h2>Неделя и месяц</h2><span class="meta" style="text-transform:capitalize">${MON[+t.slice(5,7)-1]}</span></div>
  <div class="tiles">
   <button type="button" class="tile" data-act="drill" data-k="wo-week"><div class="k">Тренировки</div><div class="v">${wk} / 3</div><div class="bar good" style="margin-top:8px"><i style="width:${Math.min(100,wk/3*100)}%"></i></div></button>
   <button type="button" class="tile" data-act="drill" data-k="pub-week"><div class="k">Публикации</div><div class="v">${pub} / 4</div><div class="bar" style="margin-top:8px"><i style="width:${Math.min(100,pub/4*100)}%"></i></div></button>
   <button type="button" class="tile" data-act="drill" data-k="net" data-m="${t.slice(0,7)}"><div class="k">Доход за месяц</div><div class="v pos">${fmtU(m.inc)}</div><div class="s">расход ${fmtU(m.out)}</div></button>
   <button type="button" class="tile" data-act="drill" data-k="debt"><div class="k">Вам должны</div><div class="v ${db_.length?'neg':''}">${fmtU(db_.reduce((a,d)=>a+toU(d.amount,d.cur,c),0))}</div><div class="s">${db_.length} поз.</div></button>
  </div></section>
 <section class="sec"><div class="sec-h"><h2>Фокус: фаза ${ph}</h2><button class="btn sm" data-tab="goals">Все цели</button></div>
  <div class="list">${focus.length?focus.map(goalRow).join(''):'<div class="empty">Цели этой фазы закрыты. Добавьте следующие во вкладке «Цели».</div>'}</div></section>
 <section class="sec"><div class="sec-h"><h2>Распорядок на сегодня</h2><button class="btn sm" data-act="settings">Изменить</button></div>
  <div class="list">${routine.length?routine.map(r=>`<div class="item"><span class="time">${esc(r.t)}</span><span class="grow">${esc(r.n)}</span></div>`).join(''):'<div class="empty">Распорядок не задан. Нажмите «Изменить».</div>'}</div></section>
 <section class="sec"><div class="sec-h"><h2>Достижения</h2></div><div class="badges">${achievements(st).map(a=>`<div class="badge ${a[2]?'on':'off'}"><b>${esc(a[0])}</b><span>${esc(a[1])}</span></div>`).join('')}</div></section>`}

function goalRow(g){return `<button class="row check ${g.done?'on':''}" data-act="goal" data-id="${esc(g.id)}" aria-pressed="${!!g.done}"><span class="box"></span><span class="grow"><span class="t">${esc(g.title)}</span><br><span class="tag ${esc(g.area)}">${esc(AREAS[g.area]||'Прочее')}</span></span><span class="xp">+${+g.xp||40}</span></button>`}

function vMoney(c){const m=monthSum(month),dl=debts(),[y,mo]=month.split('-');
 const list=S.tx.filter(x=>(x.date||'').startsWith(month)).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));
 const svc=Object.entries(m.bySvc).sort((a,b)=>b[1].v-a[1].v);let lastD='';
 const goal=+c.incomeGoal||0;
 return `<section class="sec"><div class="sec-h"><div class="month-sw"><button class="icon-btn" data-act="mon" data-d="-1" aria-label="Предыдущий месяц">‹</button><b>${MON[+mo-1]} ${y}</b><button class="icon-btn" data-act="mon" data-d="1" aria-label="Следующий месяц">›</button></div><span class="meta num">$1 = ${nf0.format(c.rate)} сум</span></div>
  <div class="tiles">
   <button type="button" class="tile" data-act="drill" data-k="inc" data-m="${month}"><div class="k">Доход</div><div class="v pos">${fmtU(m.inc)}</div><div class="s">${m.unpaid?`не оплачено ${fmtU(m.unpaid)}`:'всё получено'}</div></button>
   <button type="button" class="tile" data-act="drill" data-k="out" data-m="${month}"><div class="k">Расход</div><div class="v neg">${fmtU(m.out)}</div><div class="s">работа ${fmtU(m.biz)} · личное ${fmtU(m.pers)}</div></button>
   <button type="button" class="tile" data-act="drill" data-k="net" data-m="${month}"><div class="k">Чистыми</div><div class="v ${m.net<0?'neg':''}">${fmtU(m.net)}</div><div class="s">доход минус все расходы</div></button>
   <button type="button" class="tile" data-act="drill" data-k="debt"><div class="k">Вам должны</div><div class="v ${dl.length?'neg':''}">${fmtU(dl.reduce((a,d)=>a+toU(d.amount,d.cur,c),0))}</div><div class="s">${dl.length} поз., за всё время</div></button>
  </div>
  ${goal?`<button type="button" class="card" data-act="drill" data-k="goal" data-m="${month}"><div class="hb"><div class="l"><span>Цель месяца по доходу</span><span class="num tap-hint">${fmtU(m.inc)} из ${fmtU(goal)} </span></div><div class="bar good"><i style="width:${Math.min(100,m.inc/goal*100).toFixed(1)}%"></i></div></div></button>`:''}
  <div class="chips"><button class="chip ghost" data-act="tx-new" data-type="in">+ Доход</button><button class="chip ghost" data-act="tx-new" data-type="out">+ Расход</button>${(c.templates||[]).map((p,i)=>`<button class="chip ${p.type==='out'?'out':'in'}" data-act="tpl" data-i="${i}">${esc(p.l)}</button>`).join('')}</div></section>
 <section class="sec"><div class="sec-h"><h2>Долги</h2><span class="meta">сданные и неоплаченные</span></div>
  <div class="list">${dl.length?dl.map(d=>{const days=daysBetween(d.since||today(),today());return `<div class="item"><div class="grow"><div class="t">${esc(d.who)}</div><div class="meta">${esc(d.what)} · ${days} дн.${d.got?` · получено ${fmt(d.got,d.cur)} из ${fmt(d.total,d.cur)}`:''}${days>30?' · <span class="tag debt">больше месяца</span>':''}</div></div><span class="num" style="font-weight:600;white-space:nowrap">${fmt(d.amount,d.cur)}</span><button class="btn sm" data-act="${d.kind==='tx'?'tx-paid':'ord-paid'}" data-id="${esc(d.id)}">Оплата</button>${debtDel(d)}</div>`}).join(''):'<div class="empty">Никто не должен. Если оплата будет позже или частично, выберите «В долг» или «Частично» при записи дохода.</div>'}</div></section>
 <section class="sec"><div class="sec-h"><h2>Доход по каналам</h2></div><div class="card">${bars(m.byCh,'good','ch',month)}</div></section>
 <section class="sec"><div class="sec-h"><h2>Доход по услугам</h2></div><div class="card tbl-wrap">${svc.length?`<table><thead><tr><th>Услуга</th><th>Кол-во</th><th>Доход</th></tr></thead><tbody>${svc.map(([k,o])=>`<tr><td><button type="button" class="linkbtn" data-act="drill" data-k="svc" data-m="${month}" data-v="${esc(k)}">${esc(k)}</button></td><td>${o.n}</td><td>${fmtU(o.v)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty" style="padding:0">В этом месяце доходов пока нет.</div>'}</div></section>
 <section class="sec"><div class="sec-h"><h2>Расходы по статьям</h2></div><div class="card">${bars(m.byCat,'red','cat',month)}</div></section>
 <section class="sec"><div class="sec-h"><h2>Операции</h2><span class="meta">${list.length}</span></div><div class="list">${list.length?list.map(x=>{const hd=x.date!==lastD?`<div class="dayhead">${dmy(x.date)}</div>`:'';lastD=x.date;
  return hd+`<div class="item"><div class="grow"><div class="t">${esc(x.type==='in'?(x.service||x.channel):(x.cat))}${payTag(x)}</div><div class="meta">${esc([x.type==='in'?x.channel:'',x.party,x.note,payMeta(x)].filter(Boolean).join(' · '))}</div></div><span class="num ${x.type==='in'?'pos':'neg'}" style="font-weight:600;white-space:nowrap">${x.type==='in'?'+':'−'}${fmt(x.amount,x.cur)}</span>${delBtn('tx'+x.id,'tx-del',x.id,x.orderId?'Отменить оплату?':'')}</div>`}).join(''):'<div class="empty">В этом месяце записей нет. Начните с кнопок выше: одна запись занимает 10 секунд.</div>'}</div></section>`}

function vOrders(c){const by=k=>S.orders.filter(o=>o.status===k).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
 const open=S.orders.filter(o=>o.status!=='paid'),exp=open.reduce((a,o)=>a+toU(o.price,o.cur,c),0);
 const card=o=>{const i=ORDER_ST.findIndex(s=>s[0]===o.status),nx=ORDER_ST[i+1],late=o.due&&o.due<today()&&i<3,ot=o.status==='paid'?S.tx.find(x=>x.orderId===o.id):null,ost=ot?rest(ot):0;
  return `<div class="item"><div class="grow"><div class="t">${esc(o.client)} · ${esc(o.service)}</div><div class="meta">${fmt(o.price,o.cur)}${o.due?` · срок ${dmy(o.due)}`:''}${late?' · <span class="tag debt">просрочен</span>':''}${ost?` · <span class="tag debt">оплачен частично, остаток ${esc(fmt(ost,ot.cur))}</span>`:''}${o.note?' · '+esc(o.note):''}</div></div>${nx?`<button class="btn sm" data-act="ord-next" data-id="${esc(o.id)}">→ ${nx[1]}</button>`:''}${delBtn('o'+o.id,'ord-del',o.id,ordTx(o.id).length?'Удалить с оплатой?':'Удалить?')}</div>`};
 return `<section class="sec"><div class="tiles"><button type="button" class="tile" data-act="drill" data-k="ord-open"><div class="k">В работе</div><div class="v">${open.length}</div><div class="s">на ${fmtU(exp)} сум</div></button><button type="button" class="tile" data-act="drill" data-k="ord-done"><div class="k">Сданы, ждут оплату</div><div class="v ${by('done').length?'neg':''}">${by('done').length}</div><div class="s">отметьте «Оплачен», когда придут деньги</div></button></div>
  <button class="btn primary" data-act="ord-new">+ Новый заказ</button>
  <p class="note" style="margin:0">Статусы: принят → моделирование → печать → сдан → оплачен. Кнопка «Оплачен» открывает окно оплаты: можно внести всю сумму или часть. Доход сам попадёт в «Деньги», остаток останется в долгах. Отменённый заказ или дубль удаляйте кнопкой × (нажать два раза): вместе с заказом удалится и его оплата в «Деньгах».</p></section>
 ${ORDER_ST.slice(0,4).map(([k,n])=>{const a=by(k);return `<section class="sec"><div class="sec-h"><h2>${n}</h2><span class="meta">${a.length}</span></div><div class="list">${a.length?a.map(card).join(''):'<div class="empty">Пусто</div>'}</div></section>`}).join('')}
 <section class="sec"><div class="sec-h"><h2>Оплачено недавно</h2>${by('paid').length>8?`<button class="btn sm" data-act="ord-all">${ordAll?'Свернуть':`Все (${by('paid').length})`}</button>`:''}</div><div class="list">${(()=>{const a=by('paid').sort((x,y)=>(y.at_paid||'').localeCompare(x.at_paid||'')).slice(0,ordAll?undefined:8);return a.length?a.map(card).join(''):'<div class="empty">Пока нет</div>'})()}</div></section>`}
let ordAll=false;

function vGoals(c){const ph=curPhase();
 return `<section class="sec"><button class="btn primary" data-act="goal-new">+ Цель</button><p class="note" style="margin:0">Старт программы: ${dmy(c.start)}. Следующая фаза открывается, когда закрыта текущая, но двигаться можно в любом порядке.</p></section>
 ${PHASES.map(p=>{const g=S.goals.filter(x=>(+x.phase||1)===p.n),d=g.filter(x=>x.done).length;
  return `<section class="sec phase"><div class="phase-h"><b>Фаза ${p.n} · ${esc(p.t)}</b><span class="meta">${p.w}${p.n===ph?' · сейчас':''}</span></div>
  <div class="bar ${d===g.length&&g.length?'good':''}"><i style="width:${g.length?d/g.length*100:0}%"></i></div>
  <div class="list">${g.length?[...g].sort((a,b)=>(a.done?1:0)-(b.done?1:0)||(a.order||0)-(b.order||0)).map(x=>`<div style="display:flex;align-items:center;padding-right:8px">${goalRow(x)}${delBtn('g'+x.id,'goal-del',x.id)}</div>`).join(''):'<div class="empty">Целей нет</div>'}</div></section>`}).join('')}`}

function vSport(c){const ws=weekStart(),wk=S.workouts.filter(x=>x.date>=ws).length,w=sortedW(),last=w[w.length-1],next=last&&last.plan==='A'?'B':'A',pm=pullMax();
 const pts=w.map(x=>({d:x.date,v:bestRep(x)})).filter(p=>p.v>0).slice(-24);
 const tgt=pm<10?10:pm<15?15:20;
 let spark='';if(pts.length>=2){const W_=320,H=90,top=Math.max(tgt,...pts.map(p=>p.v)),X=i=>14+i*(W_-28)/(pts.length-1),Y=v=>H-14-v/top*(H-28);
  const line=pts.map((p,i)=>`${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join(' ');
  spark=`<svg class="spark" viewBox="0 0 ${W_} ${H}" role="img" aria-label="Лучший подход по тренировкам"><line x1="14" x2="${W_-14}" y1="${Y(tgt)}" y2="${Y(tgt)}" stroke="var(--line)" stroke-dasharray="4 4"/><text x="${W_-14}" y="${Y(tgt)-4}" text-anchor="end" font-size="10" fill="var(--muted)">цель ${tgt}</text><polygon points="${X(0)},${H-14} ${line} ${X(pts.length-1)},${H-14}" fill="var(--accent)" fill-opacity=".12"/><polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/><circle cx="${X(pts.length-1)}" cy="${Y(pts[pts.length-1].v)}" r="4" fill="var(--accent)"/><text x="14" y="${H-2}" font-size="10" fill="var(--muted)">${dmy(pts[0].d)}</text><text x="${W_-14}" y="${H-2}" text-anchor="end" font-size="10" fill="var(--muted)">${dmy(pts[pts.length-1].d)}</text></svg>`}
 return `<section class="sec"><button type="button" class="card" data-act="drill" data-k="wo-all" style="display:grid;gap:8px"><div class="meta" style="display:flex;justify-content:space-between"><span>Лучший подход подтягиваний</span><span class="tap-hint"></span></div><div style="display:flex;align-items:baseline;gap:10px"><span class="big">${pm||'—'}</span><span class="meta">цель ${tgt}</span></div>${spark||'<div class="note">После двух тренировок здесь появится график роста.</div>'}</button>
  <div class="tiles"><button type="button" class="tile" data-act="drill" data-k="wo-week"><div class="k">На этой неделе</div><div class="v">${wk} / 3</div></button><button type="button" class="tile" data-act="drill" data-k="wo-all"><div class="k">Всего тренировок</div><div class="v">${S.workouts.length}</div></button></div>
  <button class="btn primary" data-act="wo-new" data-plan="${next}">Начать: ${esc(PROGRAM[next].name)}</button>
  <div class="chips"><button class="chip ghost" data-act="wo-new" data-plan="${next==='A'?'B':'A'}">Сделать день ${next==='A'?'B':'A'}</button></div></section>
 <section class="sec"><div class="sec-h"><h2>Программа · 3 раза в неделю</h2></div>
  ${['A','B'].map(k=>`<div class="card"><b style="font-family:var(--font-display);font-weight:500">${esc(PROGRAM[k].name)}</b><div class="tbl-wrap"><table><tbody>${PROGRAM[k].ex.map(e=>`<tr><td>${esc(e.n)}</td><td>${e.sets} × ${esc(e.target)}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}
  <p class="note" style="margin:0">Чередуйте A и B: пн A, ср B, пт A, потом наоборот. Прогрессия: когда все подходы сделаны с верхней границей, добавьте 1 повтор в каждом. Подтягивания: раз в 2 недели тест на максимум в первом подходе. Отдых между подходами 2 минуты. Чтобы набирать силу и массу, ешьте досыта и добирайте белок в каждый приём пищи.</p></section>
 <section class="sec"><div class="sec-h"><h2>История</h2></div><div class="list">${w.length?[...w].reverse().slice(0,20).map(x=>`<div class="item"><span class="time">${dmy(x.date)}</span><div class="grow"><div class="t">День ${esc(x.plan)}</div><div class="meta">${esc((x.items||[]).map(i=>{const e=[...PROGRAM.A.ex,...PROGRAM.B.ex].find(z=>z.id===i.id);return (e?e.n.split(',')[0]:i.id)+': '+(i.reps||[]).join('-')}).join(' · '))}</div></div>${delBtn('w'+x.id,'wo-del',x.id)}</div>`).join(''):'<div class="empty">Тренировок ещё нет. Первая — тест: сколько подтягиваний подряд.</div>'}</div></section>`}

function vContent(c){const ws=weekStart(),pubW=S.content.filter(x=>x.status==='pub'&&(x.pubDate||'')>=ws);
 const cnt=k=>pubW.filter(x=>x.ch===k).length;
 const card=x=>{const i=CONTENT_ST.findIndex(s=>s[0]===x.status),nx=CONTENT_ST[i+1];return `<div class="item"><div class="grow"><div class="t">${esc(x.title)}</div><div class="meta"><span class="tag">${esc(CH[x.ch]||x.ch)}</span>${x.pubDate?' · '+dmy(x.pubDate):''}${x.note?' · '+esc(x.note):''}</div></div>${nx?`<button class="btn sm" data-act="ct-next" data-id="${esc(x.id)}">→ ${nx[1]}</button>`:`<span class="xp">+${CONTENT_XP[x.ch]||25}</span>`}${delBtn('c'+x.id,'ct-del',x.id)}</div>`};
 return `<section class="sec"><div class="tiles"><button type="button" class="tile" data-act="drill" data-k="pub-ig"><div class="k">Instagram на неделе</div><div class="v">${cnt('ig')} / 2</div><div class="s">для пациентов</div></button><button type="button" class="tile" data-act="drill" data-k="pub-tg"><div class="k">Telegram на неделе</div><div class="v">${cnt('tg')} / 2</div><div class="s">для врачей</div></button></div>
  <button class="btn primary" data-act="ct-new">+ Идея</button>
  <p class="note" style="margin:0">Каждый кейс даёт два материала: пост в Instagram для пациентов и разбор в Telegram для врачей. Раз в 2–3 недели из лучших кейсов собирается видео на YouTube. Перед публикацией нужно согласие пациента на фото.</p></section>
 ${CONTENT_ST.map(([k,n])=>{const a=S.content.filter(x=>x.status===k).sort((p,q)=>(q.pubDate||'').localeCompare(p.pubDate||''));const sh=k==='pub'?a.slice(0,10):a;
  return `<section class="sec"><div class="sec-h"><h2>${n}</h2><span class="meta">${a.length}</span></div><div class="list">${sh.length?sh.map(card).join(''):'<div class="empty">Пусто</div>'}</div></section>`}).join('')}`}

const VIEWS={today:vToday,money:vMoney,patients:vPatients,orders:vOrders,goals:vGoals,sport:vSport,content:vContent};
function render(){const c=cfg();$('#ttl').textContent=TITLES[tab];
 $('#tabs').innerHTML=NAV.map(([k,n,d])=>`<button class="${k===tab?'on':''}" data-tab="${k}" aria-current="${k===tab?'page':'false'}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${n}</button>`).join('');
 const ban=(!S.live&&S.loaded?'<div class="banner">Хранилище на телефоне недоступно, записи исчезнут после перезагрузки. Так бывает в режиме «Частный доступ» Safari: откройте Life OS в обычной вкладке или с экрана «Домой».</div>':S.live&&!S.loaded?'<div class="banner">Загружаю ваши данные…</div>':'')+(tab==='today'&&S.live&&S.loaded?todayBanners():'');
 $('#main').innerHTML=ban+VIEWS[tab](c);
 if(drillState&&!$('#wrap').hidden)renderDrill(false)}

/* ---------- sheet forms ---------- */
const opts=(a,sel)=>a.map(x=>`<option${x===sel?' selected':''}>${esc(x)}</option>`).join('');
const parties=()=>[...new Set([...S.tx.map(x=>x.party),...S.orders.map(o=>o.client)].filter(Boolean))];
function openSheet(html){drillState=null;drillStack=[];$('#sheet').innerHTML=html;$('#wrap').hidden=false;$('#sheet').scrollTop=0;const f=$('#sheet').querySelector('input:not([type=hidden]):not([type=radio]),select');if(f&&matchMedia('(pointer:fine)').matches)f.focus()}
function closeSheet(){drillState=null;drillStack=[];$('#wrap').hidden=true;$('#sheet').innerHTML=''}
const head=t=>`<div class="sheet-h"><h3>${t}</h3><button type="button" class="btn sm" data-act="close">Закрыть</button></div>`;
const curSeg=cur=>`<div class="seg" role="radiogroup" aria-label="Валюта"><label><input type="radio" name="cur" value="UZS" ${cur!=='USD'?'checked':''}><span>сум</span></label><label><input type="radio" name="cur" value="USD" ${cur==='USD'?'checked':''}><span>$</span></label></div>`;
function txForm(p){const c=cfg(),isIn=p.type!=='out';
 openSheet(`<form data-form="tx">${head(isIn?'Доход':'Расход')}<input type="hidden" name="type" value="${isIn?'in':'out'}">
 <label class="f">Сумма<input id="f-amt" name="amount" inputmode="decimal" autocomplete="off" placeholder="450к, 1,2м или 120" value="${p.amount||''}" required></label>
 ${curSeg(p.cur)}<div class="preview" id="f-prev"></div>
 ${isIn?`<div class="two"><label class="f">Канал<select id="f-ch" name="channel">${opts(c.channels,p.channel)}</select></label><label class="f">Услуга<select id="f-svc" name="service">${opts(c.services,p.service)}</select></label></div>
 <label class="f">Кто заплатил (врач, клиника, пациент)<input id="f-party" name="party" list="dl-p" autocomplete="off"></label><datalist id="dl-p">${parties().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>

/* ---------- patients: treatment total, payments by date, balance ----------
   history[] = payments before patientsFrom (kept on the patient, never in income);
   from patientsFrom on, a payment is a tx income with patientId, so it lands in stats */
let patQ='',patF='all';
const dmyy=s=>s?s.slice(8,10)+'.'+s.slice(5,7)+'.'+s.slice(2,4):'';
const patFrom=()=>cfg().patientsFrom||DEF.patientsFrom;
const patTx=p=>S.tx.filter(x=>x.patientId===p.id&&x.type==='in');
/* a patient payment tx stores amount = my part (what counts as income), gross = whole payment, lab/ref = parts passed on */
const patPays=p=>[...(p.history||[]).map((y,i)=>({date:y.date||'',amount:+y.amount||0,lab:y.lab,ref:y.ref,note:y.note||'',old:true,i})),
 ...patTx(p).map(x=>{const g=x.gross!=null;return {date:x.date,amount:g?+x.gross:recv(x),lab:g?x.lab:undefined,ref:g?x.ref:undefined,note:x.note&&!/^Оплата пациента/.test(x.note)?x.note:'',old:false,txId:x.id}})].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
const patPaid=p=>r2(patPays(p).reduce((a,y)=>a+y.amount,0));
const patLeft=p=>Math.max(0,r2((+p.total||0)-patPaid(p)));
const short=(v,cur)=>cur==='USD'?'$'+nf0.format(v||0):fmtU(v||0);
/* split: total − lab (техничка) − referring doctor's share = my share */
const REF_MODES=[['pctNet','% после технички'],['pctTotal','% от всей суммы'],['fixed','Сумма']];
const calcRef=(t,l,mode,v)=>r2(mode==='fixed'?v:mode==='pctTotal'?t*v/100:Math.max(0,t-l)*v/100);
const patLab=p=>+p.lab||0;
const patRef=p=>+p.refVal?calcRef(+p.total||0,patLab(p),p.refMode||'pctNet',+p.refVal):0;
const patMine=p=>r2((+p.total||0)-patLab(p)-patRef(p));
/* where a payment went: stored split, or proportional to the patient's shares when none was given */
function allocOf(p,y){if(y.lab!=null||y.ref!=null){const lab=+y.lab||0,ref=+y.ref||0;return {lab,ref,mine:r2(y.amount-lab-ref),auto:false}}
 const t=+p.total||0,lab=t?r2(y.amount*patLab(p)/t):0,ref=t?r2(y.amount*patRef(p)/t):0;return {lab,ref,mine:r2(y.amount-lab-ref),auto:!!(lab||ref)}}
function patAlloc(p){const s={lab:0,ref:0,mine:0,auto:false};for(const y of patPays(p)){const a=allocOf(p,y);s.lab+=a.lab;s.ref+=a.ref;s.mine+=a.mine;s.auto=s.auto||a.auto}s.lab=r2(s.lab);s.ref=r2(s.ref);s.mine=r2(s.mine);return s}
const refLabel=p=>!+p.refVal?'':p.refMode==='fixed'?'фиксированная сумма':`${nf1.format(+p.refVal)}% ${p.refMode==='pctTotal'?'от всей суммы':'от суммы после технички'}`;
const patCh=()=>{const ch=cfg().channels||[];return ch.find(x=>/пациент/i.test(x))||ch[0]||'Пациенты (своя практика)'};
/* ---------- visits + Calendar (.ics) ----------
   patient.visit = {date, time, eventId} (next planned visit), patient.visits = [{date, note}] (done),
   patient.every = months until the next visit (braces default 1). The app is the source; a visit goes to
   the phone's Calendar as an .ics file with UID lifeos-<patientId>-<date>, so a repeated file for the same
   date updates the event instead of adding a second one. eventId (from the Google Calendar days) is kept, unused. */
const isBraces=s=>/брекет/i.test(s||'');
const EVERY=[[0,'Не назначать'],[0.5,'Через 2 недели'],[1,'Через месяц'],[1.5,'Через 6 недель'],[2,'Через 2 месяца'],[3,'Через 3 месяца']];
const pEvery=p=>p.every!=null?+p.every:(isBraces(p.service)?1:0);
const everyLabel=n=>(EVERY.find(x=>x[0]===+n)||EVERY[0])[1];
const WD=['вс','пн','вт','ср','чт','пт','сб'];
const addMonths=(s,n)=>{n=+n;if(!n)return s;if(n===0.5)return addDays(s,14);if(n===1.5)return addDays(s,42);const d=new Date(s+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)};
const visitLabel=v=>v&&v.date?`${dmy(v.date)} ${WD[new Date(v.date+'T12:00:00').getDay()]}${v.time?' · '+v.time:''}`:'';
const inDays=d=>{const n=daysBetween(today(),d);return n===0?'сегодня':n===1?'завтра':n<0?`${-n} дн. назад`:`через ${n} дн.`};
const firstVisit=p=>{if(p.start&&p.start<today()){let d=p.start,k=0;while(d<=today()&&k<120){k++;d=addMonths(p.start,k)}return d}return addMonths(today(),1)};
const tAdd=(t,min)=>{let[h,m]=t.split(':').map(Number);m+=min;h+=Math.floor(m/60);m%=60;if(h>23){h=23;m=59}return pad(h)+':'+pad(m)};
let visAll=false;
function evInput(p,v){const all=!v.time;return {summary:`🦷 Визит: ${p.name}${p.service?` (${String(p.service).toLowerCase()})`:''}`,
 startTime:all?`${v.date}T00:00:00`:`${v.date}T${v.time}:00`,endTime:all?`${addDays(v.date,1)}T00:00:00`:`${v.date}T${tAdd(v.time,30)}:00`,allDay:all,
 availability:all?'AVAILABILITY_FREE':'AVAILABILITY_BUSY',
 description:`Визит пациента.${p.phone?' Телефон: '+p.phone+'.':''}${p.note?'\n'+p.note:''}\n\nLife OS · пациент ${p.id}`,
 overrideReminders:[{method:'popup',minutes:all?900:60}]}}
/* .ics with the same content as evInput: all-day → reminder the day before at 9:00, timed → 30 minutes, reminder an hour before */
const icsEsc=s=>String(s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){const enc=new TextEncoder(),parts=[];let cur='',n=0,lim=75;
 for(const ch of line){const b=enc.encode(ch).length;if(n+b>lim){parts.push(cur);cur='';n=0;lim=74}cur+=ch;n+=b}parts.push(cur);return parts.join('\r\n ')}
const icsUTC=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function icsVEvent(p,v){const e=evInput(p,v),r=e.overrideReminders[0].minutes;
 return ['BEGIN:VEVENT',`UID:lifeos-${p.id}-${v.date}`,`DTSTAMP:${icsUTC(new Date())}`,`SEQUENCE:${Math.floor(Date.now()/1000)-1700000000}`,
  e.allDay?`DTSTART;VALUE=DATE:${v.date.replace(/-/g,'')}`:`DTSTART:${icsUTC(new Date(e.startTime))}`,
  e.allDay?`DTEND;VALUE=DATE:${addDays(v.date,1).replace(/-/g,'')}`:`DTEND:${icsUTC(new Date(e.endTime))}`,
  `SUMMARY:${icsEsc(e.summary)}`,`DESCRIPTION:${icsEsc(e.description)}`,`TRANSP:${e.allDay?'TRANSPARENT':'OPAQUE'}`,
  'BEGIN:VALARM','ACTION:DISPLAY',`DESCRIPTION:${icsEsc(e.summary)}`,`TRIGGER:-PT${r}M`,'END:VALARM','END:VEVENT']}
const calPats=ids=>ids.map(id=>S.patients.find(p=>p.id===id)).filter(p=>p&&p.visit&&p.visit.date);
function icsFor(ids){return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Life OS Аброра//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH',
 ...calPats(ids).flatMap(p=>icsVEvent(p,p.visit)),'END:VCALENDAR'].map(icsFold).join('\r\n')+'\r\n'}
/* the sheet behind "Добавить в календарь": the data: link opens Safari's "add event" screen, sharing the file is the fallback */
function calHTML(ids){const ps=calPats(ids);if(!ps.length)return head('Добавить в календарь')+'<div class="empty">Визит не назначен.</div>';
 return head(ps.length>1?`В календарь: ${pl(ps.length,['визит','визита','визитов'])}`:'Добавить в календарь')
  +fbox(ps.map(p=>[p.name,esc(visitLabel(p.visit))]),null,ps.some(p=>!p.visit.time)?'Без времени визит стоит в календаре на весь день, напоминание накануне в 9:00. Со временем — на 30 минут, напоминание за час.':'Визит на 30 минут, напоминание за час.')
  +`<a class="btn primary" href="data:text/calendar;charset=utf-8,${encodeURIComponent(icsFor(ps.map(p=>p.id)))}">Добавить в календарь</a>
  <button type="button" class="btn wide" data-act="ics-share" data-v="${esc(ps.map(p=>p.id).join(','))}">Поделиться файлом .ics</button>
  <p class="note" style="margin:0">Повторный файл на ту же дату обновит событие, а не создаст второе. Если визит перенесён на другой день или убран, старое событие удалите в Календаре.</p>`}
async function shareIcs(ids){const ps=calPats(ids);if(!ps.length)return;
 const f=new File([icsFor(ps.map(p=>p.id))],(ps.length===1?'визит-'+ps[0].visit.date:'визиты')+'.ics',{type:'text/calendar'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}return}
 saveFile(f)}
function saveFile(f){const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function setVisit(pid,v,every){const p=S.patients.find(z=>z.id===pid);if(!p)return;const old=(p.visit||{}).eventId||'',nv={date:v.date||'',time:v.time||'',eventId:old};
 updDoc('patients',pid,{visit:nv,...(every!=null?{every}:{})});toast(v.date?`Визит ${visitLabel(nv)} сохранён. Добавьте его в календарь кнопкой в карточке`:'Визит убран. Если он был в Календаре, удалите событие там')}
function visitDone(pid){const p=S.patients.find(z=>z.id===pid);if(!p)return;const v=p.visit||{},ev=pEvery(p),t=today();
 const next=ev?{date:addMonths(t,ev),time:v.time||'',eventId:''}:{date:'',time:'',eventId:''};
 updDoc('patients',pid,{visits:[...(p.visits||[]),{date:t}],visit:next});
 toast(next.date?`Визит отмечен. Следующий: ${visitLabel(next)}. Добавьте его в календарь кнопкой ниже`:'Визит отмечен');schedule()}

 toast(`Визиты назначены: ${a.length}`);if(a.length)setTimeout(()=>openDrill({k:'cal-all',v:a.map(p=>p.id).join(',')}),0);schedule()}
function visitsSection(){const ps=S.patients,up=ps.filter(p=>p.visit&&p.visit.date).sort((a,b)=>(a.visit.date+(a.visit.time||'')).localeCompare(b.visit.date+(b.visit.time||''))),
 nv=ps.filter(p=>isBraces(p.service)&&!(p.visit&&p.visit.date)),sh=visAll?up:up.slice(0,8);

 return `<section class="sec"><div class="sec-h"><h2>Визиты</h2>${fut.length?`<button class="btn sm" data-act="drill" data-k="cal-all" data-v="${esc(fut.map(p=>p.id).join(','))}">Все в календарь</button>`:''}</div>
 <div class="list">${sh.length?sh.map(p=>{const late=p.visit.date<today();return `<div class="item" style="padding-right:8px"><button type="button" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;padding:0;background:none;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer" data-act="drill" data-k="pat" data-v="${esc(p.id)}"><span class="time" style="width:58px">${dmy(p.visit.date)}<br>${WD[new Date(p.visit.date+'T12:00:00').getDay()]}${p.visit.time?' '+p.visit.time:''}</span><div class="grow"><div class="t">${esc(p.name)}</div><div class="meta">${late?'<span class="tag debt">дата прошла: отметьте визит</span>':inDays(p.visit.date)}</div></div></button>${delBtn('v'+p.id,'vis-cancel',p.id,'Отменить визит?')}</div>`}).join(''):'<div class="empty">Визитов пока нет. У пациентов на брекетах следующий визит ставится через месяц.</div>'}</div>
 ${up.length>8?`<button class="btn sm" data-act="vis-all">${visAll?'Свернуть':`Показать все (${up.length})`}</button>`:''}

function visitBlock(p){const v=p.visit||{},ev=pEvery(p),past=(p.visits||[]).slice(-6).reverse();

const sameRev=(a,b)=>(!a&&!b)||!!(a&&b&&a.md5===b.md5&&a.modified===b.modified);

/* optional encryption: AES-GCM, key from the password via PBKDF2; the salt lives in the file and in yaSync.enc.
   The password never goes to the Disk; on this phone only the derived, non-exportable key is kept, and only if asked. */
const b64e=u=>{let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};

async function deriveKey(pass,salt,iter){const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);

async function useKey(key,salt){YA.key=key;YA.keySalt=salt;if(YA.remember)await metaSet('yaKey',{salt,key});YA.pass=null}
async function yaKey(){const e=yaS().enc;if(!e||!e.on)return null;if(YA.key&&YA.keySalt===e.salt)return YA.key;

 if(YA.pass){const k=await deriveKey(YA.pass,e.salt,e.iter);await useKey(k,e.salt);return k}return null}

/* adopt=true (sync): a password typed here for a file another device encrypted switches this phone to that key */
async function unseal(text,adopt){let j;try{j=JSON.parse(text)}catch(e){throw {code:'format'}}if(!j||j.format!=='life-os-encrypted/1')return j;

 if(typed&&adopt){await yaSetSync({enc:{on:true,salt:j.salt,iter:j.iter}});await useKey(k,j.salt)}

/* canonical JSON, so the same document compares equal whatever its key order */
function stab(v){if(Array.isArray(v))return '['+v.map(stab).join(',')+']';if(v&&typeof v==='object')return '{'+Object.keys(v).sort().filter(k=>v[k]!==undefined).map(k=>JSON.stringify(k)+':'+stab(v[k])).join(',')+'}';const s=JSON.stringify(v);return s===undefined?'null':s}
function yaMerge(remote){const since=yaS().lastSyncAt||0,rc=(remote&&remote.collections)||{},local={},out={},conf=[];let up=!remote||YA.force;
 for(const c of EXP_ORDER){const L=LDB.docs[c],R=rc[c]&&typeof rc[c]==='object'&&!Array.isArray(rc[c])?rc[c]:{},o={},w=[];
  for(const id of new Set([...L.keys(),...Object.keys(R)])){const l=L.get(id),r=R[id];
   if(!r||typeof r!=='object'){o[id]=l;up=true;continue}
   if(!l){o[id]=r;w.push([id,r]);continue}
   const sl=stab(l),sr=stab(r);if(sl===sr){o[id]=l;continue}

const payloadText=out=>JSON.stringify({format:'life-os-export/1',app:'Life OS Аброра',exportedAt:new Date().toISOString(),timezone:Intl.DateTimeFormat().resolvedOptions().timeZone,counts:countOf(out),collections:out,sync:1});
async function syncNow(){if(!db||!yaOn())return;if(YA.busy){YA.again=true;return}

 try{await yaDirs();let done=false,out=null;

 'ya-enc-on':()=>yaEncOn(),'ya-enc-off':()=>yaEncOff(),'ya-enc-old':()=>yaEncOld(),'ya-list':()=>yaShowBk(),'ya-restore':d=>yaRestore(d.v),
 'ya-conf':()=>saveFile(new File([JSON.stringify(M.conflicts||[],null,1)],'life-os-conflicts.json',{type:'application/json'}))});
document.addEventListener('change',e=>{const id=e.target.id;
 if(id==='imp-file'){const f=e.target.files&&e.target.files[0];e.target.value='';if(f)readImport(f)}
 if(id==='ya-enc'){const box=$('#ya-enc-form'),on=!!(yaS().enc&&yaS().enc.on);if(!box)return;
  box.innerHTML=e.target.checked&&!on?`<div class="banner">Если забыть пароль, копии на Диске не открыть: восстановить пароль нельзя. Запишите его в надёжном месте.</div><label class="f">Пароль<input id="ya-p1" type="password" autocomplete="new-password"></label><label class="f">Ещё раз<input id="ya-p2" type="password" autocomplete="new-password"></label><label class="cb"><input type="checkbox" id="ya-rem"> Запомнить на этом устройстве</label><button type="button" class="btn primary" data-act="ya-enc-on">Включить шифрование</button>`
  :!e.target.checked&&on?'<div class="note">Следующие файлы на Диске будут без пароля. Уже зашифрованные копии останутся зашифрованными.</div><button type="button" class="btn primary" data-act="ya-enc-off">Выключить шифрование</button>':''}});
document.addEventListener('visibilitychange',()=>{if(!yaOn())return;if(document.visibilityState==='visible')syncNow();else if(YA.t30)syncNow()});
addEventListener('online',()=>{YA.offline=false;syncNow()});
addEventListener('offline',()=>{YA.offline=true;yaUpd()});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(e=>console.warn(e));
render();
</script>
